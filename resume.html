<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume — Timothy Mitchell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .resume-download {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 2rem;
      border: 1px solid var(--accent);
    }
    .resume-download:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .resume-embed {
      width: 100%;
      height: 80vh;
      min-height: 500px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }
    .resume-placeholder {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container" id="top">
    <nav class="contact" aria-label="Contact">
      <span><a href="mailto:timothy.mitchell2022@gmail.com">timothy.mitchell2022@gmail.com</a></span>
      <span><a href="https://www.linkedin.com/in/timothy-mitchell-">LinkedIn</a></span>
      <span><a href="https://github.com/TimothyM2005">GitHub</a></span>

    </nav>
    <header>

      <p class="tagline">Portfolio of Design, CAD & Programming</p>
    </header>

    <main>
      <h2>Resume</h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem;">Download or view my resume below.</p>

      <a href="docs/resume/Timothy%20Mitchell%20-%20Resume%20Website.pdf" class="resume-download" target="_blank" rel="noopener">Download PDF</a>

  <a href="#top" class="back-to-top" aria-label="Back to top">&uarr;</a>

  <script>
    (function () {
      var btn = document.querySelector('.back-to-top');
      if (!btn) return;
      function update() {
        if (window.scrollY > 400) btn.classList.add('visible');
        else btn.classList.remove('visible');
      }
      window.addEventListener('scroll', update);
      update();
    })();
  </script>
